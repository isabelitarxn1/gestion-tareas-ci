services:
  app:
    build: .
    container_name: gestion_tareas_app
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=gestion_tareas_ci
    networks:
      - gestion_network

  db:
    image: mysql:8.0
    container_name: gestion_tareas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_tareas_ci
    volumes:
      - db_data:/var/lib/mysql
      # IMPORTANTE: se usa una ruta ABSOLUTA de Windows, no relativa
      # (./db-init). Esto es necesario porque Jenkins corre DENTRO de un
      # contenedor Docker, y le habla al daemon de Docker del HOST a
      # través del socket montado (/var/run/docker.sock). Cuando Jenkins
      # ejecuta "docker-compose up", una ruta relativa como "./db-init" se
      # resuelve respecto al directorio de trabajo del PROCESO
      # docker-compose en el host, que no es necesariamente el mismo path
      # que el workspace interno de Jenkins. Esto hacía que Docker montara
      # una carpeta vacía en vez de la carpeta real del proyecto.
      # Usando la ruta absoluta de Windows, Docker Desktop la resuelve
      # siempre de forma correcta sin importar quién invoque el comando.
      # Si tu proyecto vive en otra carpeta, ajustá esta ruta acorde.
      - C:\xampp\htdocs\gestion-tareas-ci\db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestion_network

networks:
  gestion_network:
    driver: bridge

volumes:
  db_data:
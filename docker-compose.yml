services:
  app:
    build: .
    container_name: gestion_tareas_app
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=gestion_tareas_ci
    networks:
      - gestion_network

  db:
    image: mysql:8.0
    container_name: gestion_tareas_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gestion_tareas_ci
    volumes:
      - db_data:/var/lib/mysql
      # IMPORTANTE: se monta el DIRECTORIO completo "db-init", no el archivo
      # "init.sql" suelto. Montar un archivo individual con bind mount
      # (./init.sql:/docker-entrypoint-initdb.d/init.sql) es propenso a
      # fallar en Windows + Docker Desktop (WSL2): si hay timing entre el
      # filesystem de Windows y el de la VM, Docker puede crear un
      # directorio vacío en el destino en vez de montar el archivo, lo que
      # produce el error "Can't initialize batch_readline - may be the
      # input source is a directory". Montando la carpeta completa se evita
      # ese problema.
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestion_network

networks:
  gestion_network:
    driver: bridge

volumes:
  db_data: